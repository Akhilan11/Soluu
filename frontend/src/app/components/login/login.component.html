<div class="container d-flex justify-content-center align-items-center mt-5">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
      <h2 class="mb-4 text-center" style="color: #f1356d;">Login</h2>
      <form (submit)="login()">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            id="email"
            class="form-control"
            placeholder="Enter your email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>
        <button type="submit" class="btn w-100 mb-3" style="background-color: #f1356d; color: white;">
          Login
        </button>
  
        <p class="text-center">
          Don't have an account?
          <a routerLink="/signup" class="text-decoration-none" style="color: #f1356d;">Sign up here</a>
        </p>
      </form>
    </div>
  </div>
