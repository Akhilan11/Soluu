<div class="container" style="margin-left: 2em;">

    <div class="d-flex justify-content-between align-items-center">
      <h2 style="color: #f1356d;">All Blogs</h2>
      <div class="form-group mb-2">
        <select class="form-select" [(ngModel)]="sortOrder" (change)="sortBlogs()">
          <option value="new">  Newest First &nbsp;&nbsp;&nbsp;</option>
          <option value="old">  Oldest First</option>
        </select>
      </div>
    </div>
  
    <hr>
  
    <div class="container">
      <div class="row">
        <div class="" *ngFor="let post of blogs">
          <div class="card h-100 mb-3" style="width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <div class="card-body">
              <h5 class="card-title" style="color: #f1356d;">{{ post.title }}</h5>
              <p class="card-text">{{ post.content | slice:0:100 }}...</p>
              <a [routerLink]="['/blog', post._id]">View More</a>
              <p class="mt-3 mb-0 text-muted" style="font-size: 13px;">
                Written by <strong>{{ post.username }}</strong> on {{ post.createdAt | date: 'short' }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  
  </div>
